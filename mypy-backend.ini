[mypy]
python_version = 3.10
files =
    phases/02-robot-upload-agent/src/robot_upload_agent/transport.py,
    phases/02-robot-upload-agent/src/robot_upload_agent/web.py,
    phases/04-processing-pipeline/src/processor/core.py,
    phases/04-processing-pipeline/src/processor/parquet_sinks.py,
    phases/05-query-service/src/query_service/main.py,
    phases/05-query-service/src/query_service/planner.py,
    phases/05-query-service/src/query_service/routers/query_api.py,
    phases/05-query-service/src/query_service/settings.py
mypy_path =
    phases/01-robot-storage/src,
    phases/02-robot-upload-agent/src,
    phases/04-processing-pipeline/src,
    phases/05-query-service/src,
    phases/common-config/src
namespace_packages = True
explicit_package_bases = True
check_untyped_defs = True
disallow_any_generics = True
no_implicit_optional = True
strict_equality = True
warn_redundant_casts = True
warn_return_any = True
warn_unused_ignores = True
show_error_codes = True
pretty = True

# Protobuf's generated Python modules construct descriptors and service classes
# dynamically, so mypy cannot discover their exported members from the source.
[mypy-upload_pb2]
follow_imports = skip

[mypy-upload_pb2_grpc]
follow_imports = skip

# The shipped PyArrow distribution does not expose complete PEP 561 metadata.
[mypy-pyarrow.*]
ignore_missing_imports = True
