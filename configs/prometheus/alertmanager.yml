# Operator activation template. The routing tree is valid and intentionally has
# no delivery integrations. Add webhook_configs, email_configs, or another
# supported integration to the two receivers before starting Alertmanager.
global:
  resolve_timeout: 5m

route:
  receiver: warning-operator
  group_by:
    - alertname
    - job
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: critical-operator
      matchers:
        - severity="critical"
      repeat_interval: 1h
    - receiver: warning-operator
      matchers:
        - severity="warning"

receivers:
  - name: critical-operator
  - name: warning-operator

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - job
