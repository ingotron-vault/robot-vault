name: Feature request
description: Suggest a change to Robot Vault core.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What change do you suggest?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What else did you consider?
